name: Afeiii verification
on:
  push:
    branches: [brand/thirteen-month]
  pull_request:
    branches: [brand/thirteen-month]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: afeiii-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NODE_CHROMIUM_SKIP_INSTALL: 'true'
      SITE_URL: https://check.afeiii.com
      PLATFORM: node
      ENABLE_ANALYTICS: 'false'
      PUBLIC_API_TIMEOUT_LIMIT: '45000'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test:public
      - run: yarn lint
      - run: yarn build

      - run: node scripts/stage-build-quality.mjs "${RUNNER_TEMP}/check-public-quality"
      - name: Validate generated HTML and local links
        env:
          QUALITY_SCRIPT_SHA256: 5becf9c6ed5dd4b337082f8d844aafcb35ac467baa23035052163d66db98e71e
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/bigzhihui/afeiii-portal/a86bb6a690add16309c6b7db826b0d5a400dee4f/scripts/check_generated_quality.py' --output "${RUNNER_TEMP}/check_generated_quality.py"
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"check_generated_quality.py"; assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ["QUALITY_SCRIPT_SHA256"], "Quality checker integrity mismatch"'
          python3 "${RUNNER_TEMP}/check_generated_quality.py" --bootstrap --root "${RUNNER_TEMP}/check-public-quality" --tools "${RUNNER_TEMP}/afeiii-quality-tools" --baseline scripts/quality-baseline.json --output "${RUNNER_TEMP}/web-check-quality.json"
